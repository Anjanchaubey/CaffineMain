<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caffine</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caffine">
<meta name="theme-color" content="#f5f2eb">
<link rel="icon" type="image/png" sizes="32x32" href="icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:       #0d0d0d;
  --paper:     #f5f2eb;
  --paper2:    #edeae0;
  --rule:      rgba(13,13,13,0.1);
  --rule-hard: rgba(13,13,13,0.25);
  --accent:    #c8392b;
  --accent2:   #2c4a9e;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'Epilogue', sans-serif;
  --font-mono:    'Fira Code', monospace;
}

[data-theme="yellow"] {
  --ink:       #0d0d0d;
  --paper:     #fffef5;
  --paper2:    #fffaeb;
  --rule:      rgba(13,13,13,0.08);
  --rule-hard: rgba(13,13,13,0.2);
  --accent:    #f5a623;
  --accent2:   #ffd966;
}

[data-theme="dark"] {
  --ink:       #e8e6e3;
  --paper:     #0f0f0f;
  --paper2:    #1a1a1a;
  --rule:      rgba(232,230,227,0.1);
  --rule-hard: rgba(232,230,227,0.25);
  --accent:    #ffd966;
  --accent2:   #f5a623;
}

html {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

body {
  min-height: 100vh;
  overflow: hidden;
  position: relative;
  background-image:
    repeating-linear-gradient(to bottom, transparent, transparent 39px, var(--rule) 39px, var(--rule) 40px);
}

body::before {
  content: '';
  position: fixed;
  top: 0; bottom: 0; left: 28px;
  width: 1px;
  background: rgba(200,57,43,0.35);
  pointer-events: none;
  z-index: 0;
}

[data-theme="yellow"] body::before { background: rgba(245,166,35,0.4); }
[data-theme="dark"] body::before { background: rgba(255,217,102,0.25); }

/* ── PAGE ── */
.page {
  min-height: 100vh;
  padding: 28px 20px 28px 44px;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  z-index: 1;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1.5px solid var(--rule-hard);
  margin-bottom: 0;
}

.mini-brand {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 2px;
  padding: 5px 8px;
  opacity: 0.78;
}

/* ── THEME BUTTON + POPUP ── */
.theme-btn-wrap { position: relative; }

.theme-btn {
  width: 34px; height: 34px;
  border: 1.5px solid var(--rule-hard);
  background: transparent;
  color: var(--ink);
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.theme-btn:hover { background: var(--ink); color: var(--paper); }

.theme-popup {
  position: absolute;
  top: calc(100% + 8px); right: 0;
  background: var(--paper);
  border: 1.5px solid var(--rule-hard);
  border-radius: 2px;
  padding: 16px;
  display: none;
  flex-direction: column;
  gap: 14px;
  min-width: 180px;
  box-shadow: 4px 4px 0 var(--rule-hard);
  z-index: 1000;
}
.theme-popup.active { display: flex; }

.theme-label {
  font-family: var(--font-mono);
  font-size: 8px; letter-spacing: 0.15em;
  text-transform: uppercase; opacity: 0.45;
  margin-bottom: 8px;
}

.theme-options, .color-options { display: flex; gap: 8px; }

.theme-option {
  flex: 1; padding: 8px 0;
  border: 1.5px solid var(--rule-hard);
  background: transparent;
  cursor: pointer;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); opacity: 0.5;
  transition: all 0.15s; text-align: center;
}
.theme-option:hover { opacity: 1; border-color: var(--ink); }
.theme-option.active { background: var(--ink); color: var(--paper); opacity: 1; border-color: var(--ink); }

.color-option {
  width: 28px; height: 28px;
  border: 2px solid var(--rule-hard);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.15s;
}
.color-option:hover { transform: scale(1.1); }
.color-option.active { border-color: var(--ink); border-width: 3px; }
.color-option.red { background: linear-gradient(135deg, #c8392b, #e85d4e); }
.color-option.yellow { background: linear-gradient(135deg, #f5a623, #ffd966); }

/* ── HERO ── */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 680px;
  padding: 24px 0 20px;
  border-bottom: 1.5px solid var(--rule-hard);
}

#brand-img {
  max-width: 380px;
  width: 100%;
  height: auto;
  margin-bottom: 6px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; opacity: 0.45;
  margin-bottom: 16px;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  border: 1.5px solid var(--rule-hard);
  margin-top: 20px;
}

.stat-item {
  flex: 1;
  padding: 14px 18px;
  border-right: 1.5px solid var(--rule-hard);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.15s;
}
.stat-item:last-child { border-right: none; }
.stat-item:hover { background: var(--paper2); }

.stat-value {
  font-family: var(--font-display);
  font-size: 40px; line-height: 1;
  color: var(--ink); letter-spacing: 0.02em;
}

.stat-label {
  font-family: var(--font-mono);
  font-size: 8px; letter-spacing: 0.14em;
  text-transform: uppercase; opacity: 0.4;
  line-height: 1.5;
}

/* ── COPY + CHIPS ── */
.copy {
  max-width: 500px;
  font-size: 13px; line-height: 1.65; opacity: 0.55;
  margin-top: 20px;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.chip {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--rule-hard);
  border-radius: 2px;
  padding: 5px 9px;
  opacity: 0.6;
}

/* ── INFO ROW ── */
.info-row {
  display: flex;
  gap: 0;
  margin-top: 16px;
  border: 1.5px solid var(--rule-hard);
}

.datetime-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 14px 20px;
  border-right: 1.5px solid var(--rule-hard);
  background: var(--ink);
  flex-shrink: 0;
}

.dt-time {
  font-family: var(--font-display);
  font-size: 36px; line-height: 1;
  letter-spacing: 0.04em;
  color: var(--paper);
}

.dt-date {
  font-family: var(--font-mono);
  font-size: 8px; letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper); opacity: 0.5;
  margin-top: 4px;
}

[data-theme="dark"] .datetime-block { background: var(--paper2); }
[data-theme="dark"] .dt-time { color: var(--ink); }
[data-theme="dark"] .dt-date { color: var(--ink); }

.quote-block {
  flex: 1;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
}

.quote-mark {
  font-family: Georgia, serif;
  font-size: 48px; line-height: 1;
  color: var(--accent); opacity: 0.25;
  flex-shrink: 0;
  margin-top: -8px;
}

.quote-text {
  font-family: var(--font-body);
  font-size: 11px; line-height: 1.6;
  opacity: 0.55; font-style: italic;
}

/* ── DOCK ── */
.dock {
  display: flex;
  align-items: stretch;
  border: 1.5px solid var(--rule-hard);
  border-top: none;
  overflow: hidden;
}

.tool {
  flex: 1;
  min-height: 52px;
  text-decoration: none;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 12px;
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  border-right: 1.5px solid var(--rule-hard);
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
  position: relative; overflow: hidden;
}
.tool:last-child { border-right: none; }
.tool::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--ink);
  transform: translateY(100%);
  transition: transform 0.18s ease;
  z-index: 0;
}
.tool:hover::before { transform: translateY(0); }
.tool:hover { color: var(--paper); }
.tool:hover .tool-mark { color: var(--paper); }

.tool-mark {
  font-family: var(--font-display);
  font-size: 22px; line-height: 1;
  color: var(--accent);
  position: relative; z-index: 1;
  transition: color 0.15s;
}
.tool span:last-child { position: relative; z-index: 1; }

.tool.ai {
  background: var(--ink);
  color: var(--paper);
}
.tool.ai .tool-mark { color: var(--accent); }
.tool.ai::before { background: var(--accent); }
.tool.ai:hover .tool-mark { color: var(--paper); }

/* ── DESKTOP ── */
@media (min-width: 760px) {
  body::before { left: 72px; }
  .page { padding: 34px 72px 30px 90px; }
}

/* ── MOBILE ── */
@media (max-width: 680px) {
  body { overflow: hidden; }
  body::before { left: 16px; }

  .page {
    height: 100svh;
    max-height: 100svh;
    padding: 14px 12px 14px 28px;
    overflow: hidden;
  }

  .topbar {
    padding-bottom: 12px;
    margin-bottom: 14px;
  }

  .mini-brand { font-size: 8px; padding: 4px 6px; }
  .theme-btn { width: 30px; height: 30px; }

  .hero {
    flex: 1;
    justify-content: flex-start;
    min-height: 0;
    overflow: hidden;
  }

  #brand-img { max-width: 160px; margin-bottom: 6px; }

  .eyebrow { font-size: 8px; margin-bottom: 12px; }

  .stats-bar { margin-bottom: 14px; }
  .stat-item { padding: 10px 12px; }
  .stat-value { font-size: 28px; }
  .stat-label { font-size: 7px; }

  .copy {
    font-size: 11px; line-height: 1.5;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .chips { margin-top: 10px; gap: 6px; }
  .chip { font-size: 7px; padding: 4px 7px; }

  .info-row { margin-top: 10px; flex-direction: column; }
  .datetime-block { flex-direction: row; align-items: center; gap: 14px; padding: 10px 14px; border-right: none; border-bottom: 1.5px solid var(--rule-hard); }
  .dt-time { font-size: 28px; }
  .dt-date { margin-top: 0; font-size: 7px; }

  .dock {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: none;
    flex-wrap: unset;
  }
  .tool {
    flex: unset;
    min-height: 64px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 0 16px;
    flex-direction: row;
    justify-content: flex-start;
    gap: 14px;
    border-right: 1.5px solid var(--rule-hard);
    border-bottom: 1.5px solid var(--rule-hard);
    white-space: nowrap;
  }
  .tool:nth-child(even) { border-right: none; }
  .tool:nth-child(3), .tool:nth-child(4) { border-bottom: none; }
  .tool.ai {
    grid-column: 1 / -1;
    justify-content: center;
    gap: 12px;
    border-right: none;
    border-bottom: none;
    min-height: 52px;
    background: #00ff88;
    color: #0d0d0d;
    font-size: 12px;
  }
  .tool.ai::before { background: #0d0d0d; }
  .tool.ai .tool-mark { color: #0d0d0d; font-size: 26px; }
  .tool-mark { font-size: 28px; line-height: 1; }
}
</style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <div class="mini-brand">Caffine Desk</div>
      <div class="theme-btn-wrap">
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Theme settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="theme-popup" id="theme-popup">
          <div>
            <div class="theme-label">Mode</div>
            <div class="theme-options">
              <div class="theme-option" data-mode="light">Light</div>
              <div class="theme-option" data-mode="dark">Dark</div>
            </div>
          </div>
          <div>
            <div class="theme-label">Color</div>
            <div class="color-options">
              <div class="color-option red" data-color="red" title="Red"></div>
              <div class="color-option yellow" data-color="yellow" title="Yellow"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="hero">
      <img src="c 2.png" alt="Caffine" id="brand-img">
      <p class="eyebrow">Study system / planner / tracker</p>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-value" id="streak-days">0</span>
          <span class="stat-label">Deep Work<br>Streak</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="total-hours">0h</span>
          <span class="stat-label">Total<br>Hours</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="days-logged">0</span>
          <span class="stat-label">Days<br>Logged</span>
        </div>
      </div>

      <p class="copy">A compact home for planning the day, tracking discipline, clearing tasks, and checking JEE progress.</p>

      <div class="chips">
        <span class="chip">5 tools</span>
        <span class="chip">Local context</span>
        <span class="chip">Focused study</span>
      </div>

      <div class="info-row">
        <div class="datetime-block">
          <span class="dt-time" id="current-time"></span>
          <span class="dt-date" id="current-date"></span>
        </div>
        <div class="quote-block">
          <span class="quote-mark">&ldquo;</span>
          <p class="quote-text" id="quote-text"></p>
        </div>
      </div>
    </main>

    <nav class="dock" aria-label="Main tools">
      <a class="tool" href="planner.html"><span class="tool-mark">P</span><span>Planner</span></a>
      <a class="tool" href="habit.html"><span class="tool-mark">R</span><span>Ramindance</span></a>
      <a class="tool" href="tracker.html"><span class="tool-mark">J</span><span>JEE</span></a>
      <a class="tool" href="todolist.html"><span class="tool-mark">T</span><span>To Do</span></a>
      <a class="tool ai" href="AllAi.html"><span class="tool-mark">AI</span><span>Ask</span></a>
    </nav>

  </div>

  <script>
    // ── Time & Date ──
    function updateTime() {
      const now = new Date();
      document.getElementById('current-time').textContent =
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      document.getElementById('current-date').textContent =
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Quote ──
    const quotes = [
      "Success is the sum of small efforts repeated day in and day out.",
      "The expert in anything was once a beginner.",
      "Don't watch the clock; do what it does. Keep going.",
      "Study while others are sleeping; work while others are loafing.",
      "Your future is created by what you do today, not tomorrow.",
      "Small progress is still progress.",
      "Dream big, work hard, stay focused.",
      "Every accomplishment starts with the decision to try."
    ];
    document.getElementById('quote-text').textContent =
      quotes[Math.floor(Math.random() * quotes.length)];

    const savedMode  = localStorage.getItem('caffine-mode')  || 'light';
    const savedColor = localStorage.getItem('caffine-color') || 'red';

    const applyTheme = (mode, color) => {
      const brandImg = document.getElementById('brand-img');
      if (mode === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      } else if (color === 'yellow') {
        document.documentElement.dataset.theme = 'yellow';
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      brandImg.src = color === 'yellow' ? 'C (5).png' : 'c 2.png';
    };

    applyTheme(savedMode, savedColor);

    let currentMode  = savedMode;
    let currentColor = savedColor;

    const updateActive = () => {
      document.querySelectorAll('.theme-option').forEach(o =>
        o.classList.toggle('active', o.dataset.mode === currentMode));
      document.querySelectorAll('.color-option').forEach(o =>
        o.classList.toggle('active', o.dataset.color === currentColor));
    };
    updateActive();

    const themeBtn   = document.getElementById('theme-btn');
    const themePopup = document.getElementById('theme-popup');

    themeBtn.addEventListener('click', e => { e.stopPropagation(); themePopup.classList.toggle('active'); });
    document.addEventListener('click', e => {
      if (!themePopup.contains(e.target) && e.target !== themeBtn)
        themePopup.classList.remove('active');
    });

    document.querySelectorAll('.theme-option').forEach(o => o.addEventListener('click', () => {
      currentMode = o.dataset.mode;
      localStorage.setItem('caffine-mode', currentMode);
      applyTheme(currentMode, currentColor);
      updateActive();
    }));

    document.querySelectorAll('.color-option').forEach(o => o.addEventListener('click', () => {
      currentColor = o.dataset.color;
      localStorage.setItem('caffine-color', currentColor);
      applyTheme(currentMode, currentColor);
      updateActive();
    }));

    // ── Habit stats ──
    function updateHabitStats() {
      try {
        const data    = JSON.parse(localStorage.getItem('caffine_ramindance_data') || '{}');
        const history = data.history || {};

        document.getElementById('total-hours').textContent =
          Object.values(history).reduce((a, b) => a + b, 0) + 'h';
        document.getElementById('days-logged').textContent =
          Object.values(history).filter(h => h > 0).length;

        const offset   = new Date().getTimezoneOffset() * 60000;
        const todayStr = (new Date(Date.now() - offset)).toISOString().split('T')[0];
        let d = new Date();
        if ((history[todayStr] || 0) === 0) d.setDate(d.getDate() - 1);

        let streak = 0;
        for (let i = 0; i < 365; i++) {
          const ds = (new Date(d.getTime() - d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
          if ((history[ds] || 0) >= 8) { streak++; d.setDate(d.getDate() - 1); }
          else break;
        }
        document.getElementById('streak-days').textContent = streak;
      } catch (e) {}
    }

    updateHabitStats();
    setInterval(updateHabitStats, 5000);
  </script>
</body>
</html>
