<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STB Tasks — Synced Todo List</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:wght@300;400;500;700;900&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#0d0d0d;
  --paper:#f5f2eb;
  --paper2:#edeae0;
  --rule:rgba(13,13,13,0.1);
  --rule-hard:rgba(13,13,13,0.25);
  --accent:#c8392b;
  --accent2:#2c4a9e;
  --green:#2f7d32;
  --gold:#b7861f;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Epilogue',sans-serif;
  --font-mono:'Fira Code',monospace;
  --keyboard-offset: 0px;
}
[data-theme="dark"] {
  --ink:#e8e6e3;
  --paper:#0f0f0f;
  --paper2:#1a1a1a;
  --rule:rgba(232,230,227,0.1);
  --rule-hard:rgba(232,230,227,0.25);
  --accent:#e85d4e;
  --accent2:#6f8fe0;
  --green:#79c47e;
  --gold:#d4af37;
}
html { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
body { min-height: 100vh; overflow-x: hidden; }
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.page {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 39px, var(--rule) 39px, var(--rule) 40px);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 18px 14px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1.5px solid var(--rule-hard);
}
.brand-wrap { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand {
  font-family: var(--font-display);
  font-size: 42px;
  line-height: 0.9;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.48;
  white-space: nowrap;
}
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn, .profile-btn {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--rule-hard);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.16s;
}
.icon-btn:hover, .profile-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.profile-btn {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-display);
  font-size: 18px;
  border-color: var(--ink);
}

.layout {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 22px 16px 60px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
.panel {
  border: 1.5px solid var(--rule-hard);
  background: color-mix(in srgb, var(--paper) 94%, transparent);
}
.mobile-add-fab {
  display: none;
  position: fixed;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  z-index: 120;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 10px 26px rgba(0,0,0,0.25);
  cursor: pointer;
}
.mobile-add-fab svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.6;
  stroke-linecap: round;
}
.mobile-sheet-close {
  display: none;
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--rule-hard);
  border-radius: 3px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.composer { padding: 18px; }
.section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.52;
  margin-bottom: 12px;
}
.task-input {
  width: 100%;
  border: none;
  border-bottom: 1.5px solid var(--rule-hard);
  background: transparent;
  color: var(--ink);
  outline: none;
  padding: 10px 0 12px;
  font-size: 18px;
  font-weight: 700;
}
.task-input:focus { border-bottom-color: var(--accent); }
.task-input::placeholder { color: var(--ink); opacity: 0.3; font-weight: 400; }
.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.48;
}
.field input, .field select {
  width: 100%;
  background: var(--paper2);
  color: var(--ink);
  border: 1.5px solid var(--rule-hard);
  border-radius: 3px;
  padding: 10px 11px;
  outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.primary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 46px;
  padding: 13px 18px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 21px;
  letter-spacing: 0.08em;
  transition: all 0.18s;
}
.primary-btn:hover { background: var(--accent); }
.secondary-btn {
  padding: 10px 13px;
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--rule-hard);
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.secondary-btn:hover { border-color: var(--accent); color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.stat {
  padding: 14px;
  background: var(--paper2);
  border-left: 4px solid var(--ink);
}
.stat:nth-child(2) { border-left-color: var(--green); }
.stat:nth-child(3) { border-left-color: var(--accent); }
.stat:nth-child(4) { border-left-color: var(--accent2); }
.stat-value {
  font-family: var(--font-display);
  font-size: 34px;
  line-height: 1;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.48;
  margin-top: 4px;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 12px;
}
.search {
  width: 100%;
  border: 1.5px solid var(--rule-hard);
  background: var(--paper);
  color: var(--ink);
  border-radius: 3px;
  padding: 11px 12px;
  outline: none;
}
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 8px 10px;
  border: 1.5px solid var(--rule-hard);
  background: transparent;
  color: var(--ink);
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.62;
}
.filter-btn.active {
  background: var(--ink);
  color: var(--paper);
  opacity: 1;
}
.list-panel { min-height: 360px; overflow: hidden; }
.list-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1.5px solid var(--rule-hard);
}
.sync-text {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.48;
}
.task-list { display: flex; flex-direction: column; }
.task-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  position: relative;
}
.task-card:last-child { border-bottom: none; }
.task-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--priority-color, var(--rule-hard));
}
.task-card.done { opacity: 0.62; }
.task-card.done .task-title { text-decoration: line-through; }
.check {
  width: 24px;
  height: 24px;
  border: 1.5px solid var(--rule-hard);
  border-radius: 50%;
  background: transparent;
  color: var(--paper);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}
.task-card.done .check { background: var(--green); border-color: var(--green); }
.task-title {
  font-weight: 800;
  font-size: 15px;
  line-height: 1.35;
  word-break: break-word;
}
.task-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 7px;
  border: 1px solid var(--rule-hard);
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.72;
}
.chip.overdue { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); opacity: 1; }
.task-actions { display: flex; gap: 6px; }
.mini-btn {
  width: 30px;
  height: 30px;
  border: 1px solid var(--rule-hard);
  border-radius: 3px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.mini-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.empty {
  padding: 58px 20px;
  text-align: center;
  color: var(--ink);
  opacity: 0.5;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.profile-popup, .auth-modal { color: var(--ink); }
.profile-popup {
  position: fixed;
  top: 72px;
  right: 18px;
  z-index: 160;
  width: 286px;
  display: none;
  background: var(--paper);
  border: 2px solid var(--rule-hard);
  border-radius: 4px;
  padding: 22px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.18);
}
.profile-popup.visible { display: block; }
.profile-title {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 0.05em;
  margin-bottom: 14px;
}
.profile-line { margin-bottom: 12px; }
.profile-label {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.48;
  margin-bottom: 4px;
}
.profile-value { font-size: 13px; word-break: break-all; }
.divider { height: 1px; background: var(--rule-hard); margin: 15px 0; }
.theme-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.theme-toggle { width: 48px; height: 26px; background: var(--rule-hard); border-radius: 13px; position: relative; cursor: pointer; transition: background 0.2s; }
.theme-toggle.active { background: var(--accent); }
.theme-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--paper); border-radius: 50%; transition: transform 0.2s; }
.theme-toggle.active::after { transform: translateX(22px); }

.auth-modal {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.82);
}
.auth-modal.visible { display: flex; }
.auth-box {
  width: min(420px, 90vw);
  background: var(--paper);
  border-radius: 4px;
  padding: 34px;
}
.auth-title {
  font-family: var(--font-display);
  font-size: 38px;
  letter-spacing: 0.04em;
}
.auth-subtitle {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.48;
  margin: 4px 0 22px;
}
.auth-input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--rule-hard);
  border-radius: 3px;
  outline: none;
}
.auth-input:focus { border-color: var(--accent); }
.auth-error {
  display: none;
  padding: 10px;
  margin-bottom: 12px;
  background: rgba(200,57,43,0.12);
  color: var(--accent);
  font-size: 12px;
}
.auth-toggle { margin-top: 14px; text-align: center; font-size: 12px; opacity: 0.66; }
.auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: underline; }

@media (min-width: 760px) {
  .topbar { padding: 22px 34px 16px; }
  .brand { font-size: 54px; }
  .layout { grid-template-columns: 360px 1fr; padding: 30px 22px 70px; align-items: start; }
  .composer { position: sticky; top: 98px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .wide { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .toolbar { grid-template-columns: minmax(220px, 1fr) auto; align-items: center; }
  .list-panel { min-height: 580px; }
}
@media (max-width: 520px) {
  .brand-sub { display: none; }
  .task-card { grid-template-columns: auto 1fr; }
  .task-actions { grid-column: 2; justify-content: flex-end; }
}
@media (max-width: 759px) {
  .layout { padding-bottom: 96px; }
  .mobile-add-fab { display: inline-flex; align-items: center; justify-content: center; }
  .composer {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom) + var(--keyboard-offset));
    z-index: 140;
    max-height: min(78vh, 620px);
    overflow-y: auto;
    padding: 18px;
    padding-top: 46px;
    transform: translateY(calc(100% + 24px));
    transition: transform 0.24s ease;
    box-shadow: 0 14px 44px rgba(0,0,0,0.26);
  }
  body.composer-open .composer { transform: translateY(0); }
  .mobile-sheet-close { display: inline-flex; align-items: center; justify-content: center; }
  body.composer-open .mobile-add-fab { display: none; }
  body.composer-open::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 130;
    background: rgba(0,0,0,0.36);
  }
  .composer .section-label { margin-bottom: 8px; }
  .task-input { font-size: 16px; padding: 8px 0 10px; }
  .form-grid { gap: 10px; margin-top: 12px; }
  .field input, .field select { padding: 9px 10px; }
  .primary-btn { min-height: 42px; padding: 11px 16px; font-size: 18px; }
  .stats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { padding: 9px 8px; }
  .stat-value { font-size: 25px; }
  .stat-label { font-size: 7px; letter-spacing: 0.08em; }
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand">TASKS</div>
      <div class="brand-sub">Synced Todo List</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="location.href='planner.html'" aria-label="Planner">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18"/></svg>
      </button>
      <button class="profile-btn" onclick="toggleProfile(event)" aria-label="Profile"><span id="profile-initial">?</span></button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel composer">
      <button class="mobile-sheet-close" onclick="closeComposer()" aria-label="Close add task">×</button>
      <div class="section-label">Add Task</div>
      <input id="task-title" class="task-input" placeholder="What needs to happen?" autocomplete="off">
      <div class="form-grid">
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="task-due">Due</label>
          <input id="task-due" type="date">
        </div>
        <div class="field wide">
          <label for="task-category">Category</label>
          <input id="task-category" placeholder="Study, Work, Personal">
        </div>
        <button class="primary-btn wide" id="add-btn" onclick="addTask()">Add Task</button>
      </div>
      <div class="divider"></div>
      <div class="stats">
        <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Done</div></div>
        <div class="stat"><div class="stat-value" id="stat-open">0</div><div class="stat-label">Open</div></div>
        <div class="stat"><div class="stat-value" id="stat-today">0</div><div class="stat-label">Today</div></div>
      </div>
      <div class="divider"></div>
      <button class="secondary-btn" onclick="clearCompleted()">Clear Completed</button>
    </aside>

    <section class="panel list-panel">
      <div class="toolbar">
        <input id="search-input" class="search" placeholder="Search tasks..." oninput="renderTasks()">
        <div class="filters">
          <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">All</button>
          <button class="filter-btn" data-filter="open" onclick="setFilter(this)">Open</button>
          <button class="filter-btn" data-filter="done" onclick="setFilter(this)">Done</button>
          <button class="filter-btn" data-filter="today" onclick="setFilter(this)">Today</button>
          <button class="filter-btn" data-filter="overdue" onclick="setFilter(this)">Overdue</button>
        </div>
      </div>
      <div class="list-head">
        <div class="section-label" style="margin:0">Task Board</div>
        <div class="sync-text" id="sync-status">Local</div>
      </div>
      <div class="task-list" id="task-list"></div>
    </section>
  </main>
</div>

<button class="mobile-add-fab" onclick="openComposer()" aria-label="Add task">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="profile-popup" class="profile-popup">
  <div id="profile-logged-in" style="display:none">
    <div class="profile-title">Profile</div>
    <div class="profile-line">
      <div class="profile-label">Email</div>
      <div class="profile-value" id="profile-email">-</div>
    </div>
    <div class="profile-line">
      <div class="profile-label">Sync</div>
      <div class="profile-value">Firebase enabled</div>
    </div>
    <div class="divider"></div>
    <div class="theme-row">
      <div class="profile-label">Dark Mode</div>
      <div class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></div>
    </div>
    <button class="secondary-btn" onclick="handleLogout()">Logout</button>
  </div>
  <div id="profile-logged-out">
    <div class="profile-title">Welcome</div>
    <p class="profile-value">Sign in to sync tasks across devices.</p>
    <div class="divider"></div>
    <div class="theme-row">
      <div class="profile-label">Dark Mode</div>
      <div class="theme-toggle" id="theme-toggle-guest" onclick="toggleTheme()"></div>
    </div>
    <button class="primary-btn" style="width:100%" onclick="showAuthModal(); hideProfile();">Login / Sign Up</button>
  </div>
</div>

<div id="auth-modal" class="auth-modal">
  <div class="auth-box">
    <div class="auth-title">Sync Tasks</div>
    <div class="auth-subtitle">Firebase Auth</div>
    <div id="auth-error" class="auth-error"></div>
    <div id="auth-login-form">
      <input class="auth-input" id="auth-email" type="email" placeholder="Email">
      <input class="auth-input" id="auth-password" type="password" placeholder="Password">
      <button class="primary-btn" style="width:100%" onclick="handleLogin()">Login</button>
      <div class="auth-toggle">No account? <a onclick="toggleAuthMode()">Sign up</a></div>
    </div>
    <div id="auth-signup-form" style="display:none">
      <input class="auth-input" id="signup-email" type="email" placeholder="Email">
      <input class="auth-input" id="signup-password" type="password" placeholder="Password (min 6 chars)">
      <button class="primary-btn" style="width:100%" onclick="handleSignup()">Sign Up</button>
      <div class="auth-toggle">Already synced? <a onclick="toggleAuthMode()">Login</a></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCYY2GQqS0tCXb7Oxw8AWXhpexq9e8VRUs",
  authDomain: "aspirehub-32863.firebaseapp.com",
  projectId: "aspirehub-32863",
  storageBucket: "aspirehub-32863.appspot.com",
  messagingSenderId: "686810111182",
  appId: "1:686810111182:web:4290b4b1b6e64934ec449f",
  databaseURL: "https://aspirehub-32863-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let tasks = [];
let currentUser = null;
let activeFilter = 'all';
let syncingRemote = false;
let isDarkMode = localStorage.getItem('todoTheme') === 'dark';
if (isDarkMode) document.documentElement.setAttribute('data-theme', 'dark');

function uid() {
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function loadLocal() {
  try {
    tasks = JSON.parse(localStorage.getItem('todoTasks') || '[]');
  } catch {
    tasks = [];
  }
}

function saveLocal() {
  localStorage.setItem('todoTasks', JSON.stringify(tasks));
}

function syncTasks() {
  saveLocal();
  renderTasks();
  if (currentUser && !syncingRemote) {
    db.ref(`users/${currentUser.uid}/todos`).set(tasks);
    setSyncStatus('Synced');
  }
}

function openComposer() {
  document.body.classList.add('composer-open');
  setTimeout(() => document.getElementById('task-title').focus(), 120);
}

function closeComposer() {
  document.body.classList.remove('composer-open');
}

function setSyncStatus(text) {
  document.getElementById('sync-status').textContent = currentUser ? text : 'Local';
}

function addTask() {
  const titleEl = document.getElementById('task-title');
  const title = titleEl.value.trim();
  if (!title) {
    titleEl.focus();
    return;
  }

  tasks.unshift({
    id: uid(),
    title,
    priority: document.getElementById('task-priority').value,
    due: document.getElementById('task-due').value,
    category: document.getElementById('task-category').value.trim() || 'General',
    done: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });

  titleEl.value = '';
  document.getElementById('task-category').value = '';
  titleEl.focus();
  if (window.matchMedia('(max-width: 759px)').matches) closeComposer();
  syncTasks();
}

function toggleTask(id) {
  tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done, updatedAt: Date.now() } : task);
  syncTasks();
}

function deleteTask(id) {
  tasks = tasks.filter(task => task.id !== id);
  syncTasks();
}

function editTask(id) {
  const task = tasks.find(item => item.id === id);
  if (!task) return;
  const next = prompt('Edit task', task.title);
  if (next === null) return;
  const title = next.trim();
  if (!title) return;
  tasks = tasks.map(item => item.id === id ? { ...item, title, updatedAt: Date.now() } : item);
  syncTasks();
}

function clearCompleted() {
  tasks = tasks.filter(task => !task.done);
  syncTasks();
}

function setFilter(btn) {
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

function isOverdue(task) {
  return task.due && task.due < todayKey() && !task.done;
}

function priorityColor(priority) {
  return { high: 'var(--accent)', medium: 'var(--gold)', low: 'var(--green)' }[priority] || 'var(--rule-hard)';
}

function filteredTasks() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  return tasks.filter(task => {
    const textMatch = !query || `${task.title} ${task.category} ${task.priority}`.toLowerCase().includes(query);
    if (!textMatch) return false;
    if (activeFilter === 'open') return !task.done;
    if (activeFilter === 'done') return task.done;
    if (activeFilter === 'today') return task.due === todayKey();
    if (activeFilter === 'overdue') return isOverdue(task);
    return true;
  });
}

function renderTasks() {
  const list = document.getElementById('task-list');
  const visible = filteredTasks();

  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-done').textContent = tasks.filter(t => t.done).length;
  document.getElementById('stat-open').textContent = tasks.filter(t => !t.done).length;
  document.getElementById('stat-today').textContent = tasks.filter(t => t.due === todayKey()).length;

  if (!visible.length) {
    list.innerHTML = '<div class="empty">No tasks in this view</div>';
    return;
  }

  list.innerHTML = visible.map(task => `
    <article class="task-card ${task.done ? 'done' : ''}" style="--priority-color:${priorityColor(task.priority)}">
      <button class="check" onclick="toggleTask('${task.id}')" aria-label="Toggle task">${task.done ? '&#10003;' : ''}</button>
      <div>
        <div class="task-title">${escapeHTML(task.title)}</div>
        <div class="task-meta">
          <span class="chip">${escapeHTML(task.priority)}</span>
          <span class="chip">${escapeHTML(task.category || 'General')}</span>
          ${task.due ? `<span class="chip ${isOverdue(task) ? 'overdue' : ''}">${escapeHTML(task.due)}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="mini-btn" onclick="editTask('${task.id}')" aria-label="Edit">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="mini-btn" onclick="deleteTask('${task.id}')" aria-label="Delete">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 15H6L5 6"/></svg>
        </button>
      </div>
    </article>
  `).join('');
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function showAuthModal() {
  document.getElementById('auth-modal').classList.add('visible');
}

function hideAuthModal() {
  document.getElementById('auth-modal').classList.remove('visible');
  document.getElementById('auth-error').style.display = 'none';
}

function toggleAuthMode() {
  const login = document.getElementById('auth-login-form');
  const signup = document.getElementById('auth-signup-form');
  login.style.display = login.style.display === 'none' ? 'block' : 'none';
  signup.style.display = signup.style.display === 'none' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}

function showAuthError(message) {
  const el = document.getElementById('auth-error');
  el.textContent = message;
  el.style.display = 'block';
}

async function handleLogin() {
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('auth-email').value,
      document.getElementById('auth-password').value
    );
    hideAuthModal();
  } catch (err) {
    showAuthError(err.message);
  }
}

async function handleSignup() {
  try {
    await auth.createUserWithEmailAndPassword(
      document.getElementById('signup-email').value,
      document.getElementById('signup-password').value
    );
    hideAuthModal();
  } catch (err) {
    showAuthError(err.message);
  }
}

async function handleLogout() {
  await auth.signOut();
  hideProfile();
}

function updateAuthUI() {
  const initial = document.getElementById('profile-initial');
  const loggedIn = document.getElementById('profile-logged-in');
  const loggedOut = document.getElementById('profile-logged-out');
  const email = document.getElementById('profile-email');

  if (currentUser) {
    initial.textContent = (currentUser.email || '?').charAt(0).toUpperCase();
    email.textContent = currentUser.email || '-';
    loggedIn.style.display = 'block';
    loggedOut.style.display = 'none';
  } else {
    initial.textContent = '?';
    loggedIn.style.display = 'none';
    loggedOut.style.display = 'block';
  }
  updateThemeToggle();
  setSyncStatus(currentUser ? 'Synced' : 'Local');
}

function toggleTheme() {
  isDarkMode = !isDarkMode;
  if (isDarkMode) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('todoTheme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('todoTheme', 'light');
  }
  updateThemeToggle();
}

function updateThemeToggle() {
  document.getElementById('theme-toggle')?.classList.toggle('active', isDarkMode);
  document.getElementById('theme-toggle-guest')?.classList.toggle('active', isDarkMode);
}

function toggleProfile(event) {
  event?.stopPropagation();
  document.getElementById('profile-popup').classList.toggle('visible');
}

function hideProfile() {
  document.getElementById('profile-popup').classList.remove('visible');
}

document.addEventListener('click', e => {
  const popup = document.getElementById('profile-popup');
  const btn = document.querySelector('.profile-btn');
  if (popup.classList.contains('visible') && !popup.contains(e.target) && !btn.contains(e.target)) {
    hideProfile();
  }
  if (document.body.classList.contains('composer-open') && e.target === document.body) {
    closeComposer();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeComposer();
});

document.getElementById('auth-modal').addEventListener('click', e => {
  if (e.target.id === 'auth-modal') hideAuthModal();
});

document.getElementById('task-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function updateKeyboardOffset() {
  if (!window.visualViewport) return;
  const offset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
  document.documentElement.style.setProperty('--keyboard-offset', `${offset}px`);
}

window.visualViewport?.addEventListener('resize', updateKeyboardOffset);
window.visualViewport?.addEventListener('scroll', updateKeyboardOffset);
updateKeyboardOffset();

auth.onAuthStateChanged(user => {
  currentUser = user;
  updateAuthUI();

  if (!user) {
    loadLocal();
    renderTasks();
    return;
  }

  const ref = db.ref(`users/${user.uid}/todos`);
  ref.once('value').then(snapshot => {
    const remote = snapshot.val();
    if (Array.isArray(remote)) {
      syncingRemote = true;
      tasks = remote;
      saveLocal();
      syncingRemote = false;
      renderTasks();
      setSyncStatus('Synced');
    } else {
      ref.set(tasks);
      setSyncStatus('Synced');
    }
  });

  ref.on('value', snapshot => {
    if (!currentUser || syncingRemote) return;
    const remote = snapshot.val();
    if (Array.isArray(remote)) {
      tasks = remote;
      saveLocal();
      renderTasks();
      setSyncStatus('Synced');
    }
  });
});

loadLocal();
renderTasks();
updateThemeToggle();
</script>
</body>
</html>
