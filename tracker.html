<html lang="en">
<head>

    <!-- Tailwind CSS -->

    <!-- Font Awesome -->

    <!-- Fonts -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        math: '#ef4444',        // Red
                        physics: '#22c55e',     // Green
                        chemistry: '#a855f7',   // Purple
                        dark: '#0a0a0a',
                        card: '#111111',
                    },
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                        mono: ['DM Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8f5f0;
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .dark body { background-color: #0a0a0a; }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        .dark body::before { opacity: 0.12; }

        /* Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #333; }

        /* Glass Header */
        .glass-header {
            background: rgba(248, 245, 240, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .dark .glass-header {
            background: rgba(10, 10, 10, 0.88);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        /* Cards */
        .soft-card {
            background: #ffffff;
            box-shadow: 0 2px 20px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.04);
        }
        .dark .soft-card {
            background: #111111;
            box-shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
        }
        .subject-card {
            position: relative;
            border-radius: 20px;
            border: 1px solid rgba(15,23,42,0.06);
            box-shadow: 0 18px 45px rgba(15,23,42,0.06), 0 1px 0 rgba(255,255,255,0.8) inset;
        }
        .dark .subject-card {
            border-color: rgba(255,255,255,0.06);
            box-shadow: 0 18px 45px rgba(0,0,0,0.42), 0 1px 0 rgba(255,255,255,0.05) inset;
        }
        .subject-card::after {
            content: '';
            position: absolute;
            inset: auto 18px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(15,23,42,0.14), transparent);
            opacity: 0.5;
        }

        /* Subject card headers */
        .header-math { background: linear-gradient(135deg, rgba(239,68,68,0.08) 0%, rgba(239,68,68,0.03) 100%); border-bottom: 1px solid rgba(239,68,68,0.12); }
        .header-physics { background: linear-gradient(135deg, rgba(34,197,94,0.08) 0%, rgba(34,197,94,0.03) 100%); border-bottom: 1px solid rgba(34,197,94,0.12); }
        .header-chemistry { background: linear-gradient(135deg, rgba(168,85,247,0.08) 0%, rgba(168,85,247,0.03) 100%); border-bottom: 1px solid rgba(168,85,247,0.12); }

        .dark .header-math { background: linear-gradient(135deg, rgba(239,68,68,0.12) 0%, rgba(239,68,68,0.04) 100%); border-bottom: 1px solid rgba(239,68,68,0.18); }
        .dark .header-physics { background: linear-gradient(135deg, rgba(34,197,94,0.12) 0%, rgba(34,197,94,0.04) 100%); border-bottom: 1px solid rgba(34,197,94,0.18); }
        .dark .header-chemistry { background: linear-gradient(135deg, rgba(168,85,247,0.12) 0%, rgba(168,85,247,0.04) 100%); border-bottom: 1px solid rgba(168,85,247,0.18); }

        /* Progress bar */
        .progress-transition { transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }

        /* Checkbox */
        .check-wrap input:checked + .check-box {
            transform: scale(1);
        }
        .check-box { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .check-box svg { transition: opacity 0.2s, transform 0.2s; }

        /* Row hover */
        .chapter-row { transition: background 0.15s ease; }
        .chapter-row:hover { background: rgba(0,0,0,0.025); }
        .dark .chapter-row:hover { background: rgba(255,255,255,0.025); }

        /* Tag label */
        .tag {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Rank badge */
        .rank-badge {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
        }

        /* Section label */
        .section-label {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.5;
        }

        /* Stat number */
        .stat-num {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Chapter name */
        .chapter-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
        }

        /* Glow bars */
        .glow-math { box-shadow: 0 0 8px rgba(239,68,68,0.5); }
        .glow-physics { box-shadow: 0 0 8px rgba(34,197,94,0.5); }
        .glow-chemistry { box-shadow: 0 0 8px rgba(168,85,247,0.5); }

        /* Sub-section divider */
        .subsection-label {
            font-family: 'DM Mono', monospace;
            font-size: 8px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .class-switcher {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(15,23,42,0.08);
            box-shadow: 0 10px 28px rgba(15,23,42,0.07);
        }
        .dark .class-switcher {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }
        .class-tab {
            min-width: 86px;
            padding: 8px 14px;
            border-radius: 999px;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(15,23,42,0.55);
            transition: all 0.18s ease;
        }
        .dark .class-tab { color: rgba(229,231,235,0.55); }
        .class-tab.active {
            color: #fff;
            background: linear-gradient(135deg, #0f172a, #334155);
            box-shadow: 0 8px 20px rgba(15,23,42,0.18);
        }
        .dark .class-tab.active {
            color: #0a0a0a;
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
        }
        .class-hero {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(15,23,42,0.07);
            background:
                radial-gradient(circle at 12% 18%, rgba(239,68,68,0.14), transparent 28%),
                radial-gradient(circle at 80% 10%, rgba(34,197,94,0.12), transparent 24%),
                radial-gradient(circle at 60% 90%, rgba(168,85,247,0.12), transparent 30%),
                rgba(255,255,255,0.76);
            box-shadow: 0 18px 45px rgba(15,23,42,0.07);
        }
        .dark .class-hero {
            border-color: rgba(255,255,255,0.07);
            background:
                radial-gradient(circle at 12% 18%, rgba(239,68,68,0.18), transparent 28%),
                radial-gradient(circle at 80% 10%, rgba(34,197,94,0.14), transparent 24%),
                radial-gradient(circle at 60% 90%, rgba(168,85,247,0.14), transparent 30%),
                rgba(17,17,17,0.78);
            box-shadow: 0 18px 45px rgba(0,0,0,0.38);
        }
        .class-hero-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .class-hero-copy {
            max-width: 560px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            body { padding-bottom: 56px; }

            .glass-header {
                background: rgba(248, 245, 240, 0.94);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
            }
            .dark .glass-header { background: rgba(10, 10, 10, 0.94); }

            .mobile-header-shell { padding: 10px 16px 12px; }
            .mobile-brand-logo { width: 34px; height: 34px; }
            .mobile-icon-button { width: 34px; height: 34px; }
            .mobile-main { padding-top: 104px; }

            .stats-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px !important;
                margin: 0 0 18px !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .stats-grid .soft-card {
                min-width: 0;
                height: 104px;
                padding: 14px;
                border-radius: 18px;
            }
            .stats-grid .soft-card:first-child {
                gap: 10px;
            }
            .stats-grid .soft-card:first-child > .relative {
                width: 58px !important;
                height: 58px !important;
            }
            .stats-grid .soft-card:first-child svg {
                width: 58px;
                height: 58px;
            }
            .stats-grid .stat-num,
            .stats-grid .rank-badge { font-size: 20px; }
            .stats-grid .section-label { font-size: 8px; }

            .class-hero {
                border-radius: 18px;
                margin-bottom: 18px;
                padding: 18px;
                gap: 16px;
            }
            .class-hero-title {
                font-size: 28px;
                line-height: 1;
            }
            .class-hero-copy {
                font-size: 13px;
                line-height: 1.45;
            }
            .class-switcher {
                width: auto;
                align-self: flex-start;
                display: inline-flex;
                border-radius: 999px;
                padding: 3px;
            }
            .class-tab {
                min-width: 62px;
                padding: 7px 10px;
                border-radius: 999px;
                font-size: 9px;
            }

            .subject-card {
                border-radius: 18px;
                box-shadow: 0 12px 30px rgba(15,23,42,0.06), 0 1px 0 rgba(255,255,255,0.8) inset;
            }
            .dark .subject-card {
                box-shadow: 0 12px 30px rgba(0,0,0,0.38), 0 1px 0 rgba(255,255,255,0.05) inset;
            }
            .subject-card > div:first-child { padding: 14px 16px; }

            .chapter-row {
                align-items: flex-start;
                gap: 12px;
                padding: 12px 10px;
                border-radius: 14px;
            }
            .chapter-name {
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                font-size: 13px;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }
            .check-wrap {
                gap: 5px;
                padding-top: 1px;
            }
            .check-wrap .relative {
                width: 22px !important;
                height: 22px !important;
            }
            .check-box { border-radius: 7px; }
            .check-box svg {
                width: 13px;
                height: 13px;
            }
            .subsection-label { font-size: 8px; }
        }

        /* Hero splash */
        #hero-splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f5f0;
            transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
            pointer-events: all;
        }
        .dark #hero-splash { background: #0a0a0a; }
        #hero-splash.dismissed {
            opacity: 0;
            transform: translateY(-32px) scale(0.97);
            pointer-events: none;
        }

        @keyframes nudge { 0%,100%{transform:translateY(0)} 50%{transform:translateY(7px)} }
        .nudge { animation: nudge 1.5s ease-in-out infinite; }

        #main-content {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.5s ease 0.15s, transform 0.5s ease 0.15s;
        }
        #main-content.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

            let totalAll = 0, doneAll = 0;
            const pct = {};

            ['math', 'physics', 'chemistry'].forEach(sub => {
                if (!window.appData[sub]) return;
                const total = window.appData[sub].length * 2;
                let done = 0;
                window.appData[sub].forEach(ch => { if(ch.theory) done++; if(ch.questions) done++; });
                pct[sub] = total === 0 ? 0 : Math.round((done / total) * 100);
                totalAll += total;
                doneAll += done;
                document.getElementById(subjectMeta[sub].barId).style.width = `${pct[sub]}%`;
                document.getElementById(subjectMeta[sub].textId).innerText = `${pct[sub]}%`;
            });

            const global = totalAll === 0 ? 0 : Math.round((doneAll / totalAll) * 100);
            document.getElementById('global-progress').style.width = `${global}%`;
            document.getElementById('global-percentage').innerText = `${global}%`;
            document.getElementById('total-tasks-done').innerText = `${doneAll}/${totalAll}`;
            document.getElementById('ring-pct').innerText = `${global}%`;

            // Circular arcs — circumference = 2π×28 ≈ 175.93
            // Each arc is drawn as a fraction of the full circle, stacked via dashoffset rotation trick
            // We use a single-ring approach: each subject gets its own arc offset so they appear as segments
            const C = 175.93;
            const subjects3 = ['math', 'physics', 'chemistry'];
            let cumulative = 0;
            subjects3.forEach(sub => {
                const arc = document.getElementById(`arc-${sub}`);
                if (!arc) return;
                const subTotal = window.appData[sub] ? window.appData[sub].length * 2 : 0;
                let subDone = 0;
                if (window.appData[sub]) window.appData[sub].forEach(ch => { if(ch.theory) subDone++; if(ch.questions) subDone++; });
                const fraction = totalAll === 0 ? 0 : subDone / totalAll;
                const segLen = fraction * C;
                // offset = C - segLen, then rotate by cumulative angle via stroke-dashoffset trick with transform
                arc.style.strokeDashoffset = C - segLen;
                arc.style.transform = `rotate(${(cumulative / C) * 360}deg)`;
                arc.style.transformOrigin = '36px 36px';
                cumulative += segLen;
            });

            // Rank system
            const rankEl = document.getElementById('user-rank');
            if (global === 0)         rankEl.innerText = "Aspirant";
            else if (global < 20)     rankEl.innerText = "Grinder";
            else if (global < 40)     rankEl.innerText = "Scholar";
            else if (global < 60)     rankEl.innerText = "Cracker";
            else if (global < 80)     rankEl.innerText = "Topper";
            else if (global < 100)    rankEl.innerText = "AIR Bound";
            else {
                rankEl.innerText = "AIR 1";
                if (!sessionStorage.getItem('confettiShown')) {
                    triggerConfetti();
                    sessionStorage.setItem('confettiShown', 'true');
                }
            }

            // Focus area — lagging subject
            let minPct = 101, focusSub = "Balanced";
            ['math', 'physics', 'chemistry'].forEach(sub => {
                if (pct[sub] < minPct) { minPct = pct[sub]; focusSub = sub.charAt(0).toUpperCase() + sub.slice(1); }
            });
            if (pct.math === pct.physics && pct.physics === pct.chemistry && pct.math > 0) focusSub = "Consistent";
            if (global === 100) focusSub = "All Done!";
            document.getElementById('focus-area').innerText = focusSub;
        };

        function triggerConfetti() {

            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            const rand = (a, b) => Math.random() * (b - a) + a;
            const iv = setInterval(() => {
                if (Date.now() > end) return clearInterval(iv);
                const pc = 50 * ((end - Date.now()) / 3000);
                confetti({ ...defaults, particleCount: pc, colors: ['#ef4444','#22c55e','#a855f7'], origin: { x: rand(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({ ...defaults, particleCount: pc, colors: ['#ef4444','#22c55e','#a855f7'], origin: { x: rand(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);

            });
            const global = totalAll === 0 ? 0 : Math.round((doneAll / totalAll) * 100);
            document.getElementById('hero-pct').innerText = `${global}%`;
            let cumulative = 0;
            ['math', 'physics', 'chemistry'].forEach(sub => {
                const arc = document.getElementById(`hero-arc-${sub}`);
                if (!arc) return;
                const fraction = totalAll === 0 ? 0 : (subDones[sub] || 0) / totalAll;
                const segLen = fraction * C_HERO;
                arc.style.strokeDashoffset = C_HERO - segLen;
                arc.style.transform = `rotate(${(cumulative / C_HERO) * 360}deg)`;
                arc.style.transformOrigin = '90px 90px';
                cumulative += segLen;
            });
        }

        // Lock scroll immediately so browser scroll restore can't fire
        document.body.style.overflow = 'hidden';
        history.scrollRestoration = 'manual';
        window.scrollTo(0, 0);

        window.dismissSplash = function() {
            const splash = document.getElementById('hero-splash');
            if (splash.classList.contains('dismissed')) return;
            splash.classList.add('dismissed');
            document.body.style.overflow = '';
            document.getElementById('main-content').classList.add('visible');
        };

        // Only attach scroll listener after 800ms — safely past any browser scroll restore
        setTimeout(() => {
            window.addEventListener('scroll', dismissSplash, { passive: true, once: true });
        }, 800);

        // ── INIT ───────────────────────────────────────────────────────
        window.init = function() {
            updateClassUI();
            ['math', 'physics', 'chemistry'].forEach(renderList);
            calculateStats();
            updateHeroArcs();
        };

        init();
        // Trigger hero arcs after a short delay so CSS transition plays
        setTimeout(updateHeroArcs, 120);
    </script>
</body>
</html>
